[project]
name = "web-scraper"
version = "0.1.0"
description = "A polite web scraper: fetch, extract, paginate, store, report."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"evals/gold/cases.py" = ["E501"]  # frozen gold set: never reformatted
"evals/run_all.py" = ["E501"]  # long f-strings that render the README table
"docs/demo/make_video.py" = ["E501"]  # caption and scene text
